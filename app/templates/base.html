<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - GLH</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script defer src="{{ url_for('static', filename='darkmode.js') }}"></script>

    <!-- Accessibility: scalable text -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<nav aria-label="Main navigation">
    <a href="{{ url_for('main_routes.home') }}">Home</a>

    {% if current_user.is_authenticated %}
        <a href="{{ url_for('main_routes.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('main_routes.logout') }}">Logout</a>
    {% else %}
        <a href="{{ url_for('main_routes.login') }}">Login</a>
        <a href="{{ url_for('main_routes.register') }}">Register</a>
    {% endif %}
</nav>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
